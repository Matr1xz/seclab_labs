 

local <IP SERVER>

port <PORT>

proto udp4

dev tun

keepalive 10 120

 

topology subnet

server 10.8.0.0 255.255.255.0

 

verb 3

auth-nocache

user nobody

group nogroup

explicit-exit-notify

 

auth SHA512

persist-key

persist-tun

cipher AES-256-GCM

tls-server

remote-cert-eku "TLS Web Client Authentication"

 

ca ca.crt

cert server.crt

key server.key

tls-crypt tc.key

dh none

 

